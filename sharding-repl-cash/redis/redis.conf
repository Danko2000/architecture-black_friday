# Основные настройки
port 6379
bind 0.0.0.0

# Данные
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Память и производительность
maxmemory 256mb
maxmemory-policy allkeys-lru

# Безопасность
requirepass 123

# Логирование
loglevel notice
logfile /data/redis.log

# Репликация (на Primary не требуется)
# slaveof — не указываем, т.к. это Master
