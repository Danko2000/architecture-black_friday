# Основные настройки
port 6379
bind 0.0.0.0

# Данные
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Память и производительность
maxmemory 256mb
maxmemory-policy allkeys-lru

# Безопасность — должен совпадать с паролем на Primary
masterauth 123
requirepass 123

# Репликация — указываем Primary
replicaof redis-primary 6379

# Логирование
loglevel notice
logfile /data/redis.log